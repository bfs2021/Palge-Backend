openapi: 3.1.0

info:
  title: Palge API
  version: 0.5.0
  description: Production-oriented REST API written in Golang

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Health
    description: Service health and diagnostic endpoints
  - name: Accounts
    description: Account management and banking operations
  - name: Users
    description: User registration and activation
  - name: Authentication
    description: Authentication token operations

security:
  - bearerAuth: []

paths:
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: Get all accounts
      description: Retrieve all accounts ordered by ID.
      responses:
        "200":
          description: Accounts retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account
      description: Create a new bank account owned by the given owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          headers:
            Location:
              description: Path of the newly created account
              schema:
                type: string
                example: /v1/accounts/1
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      description: Retrieve a single account by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Account retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/accounts/{id}/deposit:
    post:
      operationId: depositAccount
      tags: [Accounts]
      summary: Deposit funds
      description: Add funds to the account identified by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "200":
          description: Funds deposited
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/accounts/{id}/withdraw:
    post:
      operationId: withdrawAccount
      tags: [Accounts]
      summary: Withdraw funds
      description: Deduct funds from the account identified by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "200":
          description: Funds withdrawn
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/transfers:
    post:
      operationId: transferFunds
      tags: [Accounts]
      summary: Transfer funds
      description: Move funds from one account to another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Funds transferred
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/users:
    post:
      operationId: registerUser
      tags: [Users]
      summary: Register a user
      description: Register a new user and send an activation email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "202":
          description: User registered
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/users/activated:
    put:
      operationId: activateUser
      tags: [Users]
      summary: Activate a user
      description: Activate a user account using an activation token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateUserRequest"
      responses:
        "200":
          description: User activated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tokens/authentication:
    post:
      operationId: createToken
      tags: [Authentication]
      summary: Create an authentication token
      description: Exchange an email address and password for an authentication token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthenticationTokenRequest"
      responses:
        "201":
          description: Authentication token created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/healthcheck:
    get:
      operationId: healthcheck
      tags: [Health]
      summary: Health check
      description: Report service availability and system information.
      security: []
      responses:
        "200":
          description: Service status
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheck"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/slow:
    get:
      operationId: slow
      tags: [Health]
      summary: Slow endpoint
      description: Artificially slow endpoint used to exercise timeouts.
      security: []
      responses:
        "200":
          description: Request finished
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: finished
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: available
        system_info:
          type: object
          properties:
            environment:
              type: string
            version:
              type: string
      required:
        - status
        - system_info

    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
        owner:
          type: string
        balance:
          type: integer
          format: int64
          minimum: 0
      required:
        - id
        - owner
        - balance

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
        activated:
          type: boolean
      required:
        - id
        - created_at
        - name
        - email
        - activated

    AuthenticationToken:
      type: object
      properties:
        token:
          type: string
        expiry:
          type: string
          format: date-time
      required:
        - token
        - expiry

    Error:
      type: object
      properties:
        code:
          type: string
          example: record_not_found
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
      required:
        - code
        - message

    CreateAccountRequest:
      type: object
      properties:
        owner:
          type: string
        initial_balance:
          type: integer
          format: int64
          minimum: 0
          default: 0
      required:
        - owner

    AmountRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
      required:
        - amount

    TransferRequest:
      type: object
      properties:
        from:
          type: integer
          format: int64
          minimum: 1
        to:
          type: integer
          format: int64
          minimum: 1
          description: Must differ from from
        amount:
          type: integer
          format: int64
          minimum: 1
      required:
        - from
        - to
        - amount

    RegisterUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      required:
        - name
        - email
        - password

    ActivateUserRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 26
          maxLength: 26
      required:
        - token

    CreateAuthenticationTokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      required:
        - email
        - password

    AccountResponse:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/Account"
      required:
        - account

    AccountListResponse:
      type: object
      properties:
        account:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required:
        - account

    TransferResponse:
      type: object
      properties:
        transfer:
          type: object
          properties:
            from:
              $ref: "#/components/schemas/Account"
            to:
              $ref: "#/components/schemas/Account"
          required:
            - from
            - to
      required:
        - transfer

    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    AuthenticationResponse:
      type: object
      properties:
        authentication:
          $ref: "#/components/schemas/AuthenticationToken"
      required:
        - authentication

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  headers:
    XRequestID:
      description: Unique request identifier, echoed from the request or generated when absent
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request or unreadable JSON body
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Missing, invalid, or expired authentication token
      headers:
        WWW-Authenticate:
          description: Always `Bearer` on 401
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Invalid email or password
      headers:
        WWW-Authenticate:
          description: Always `Bearer` on 401
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Edit conflict, the record was modified concurrently
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Account not activated or permission denied
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Request failed validation or a business rule (e.g. insufficient balance, same-account transfer)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
